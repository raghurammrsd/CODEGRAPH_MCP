name: 'CodeGraph PR Blast Radius & Risk Gate'
description: 'Deterministic AST-level change impact analysis, route drift detection, and targeted test selection for Pull Requests.'
author: 'Raghuram (raghurammrsd)'
branding:
  icon: 'git-pull-request'
  color: 'orange'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments and check status'
    required: false
    default: ${{ github.token }}
  base-ref:
    description: 'Base Git branch or commit to compare against'
    required: false
    default: 'origin/main'
  fail-on-breaking:
    description: 'Fail the action if breaking contract changes or deleted routes are detected'
    required: false
    default: 'false'
  output-file:
    description: 'Path where the generated markdown review should be written'
    required: false
    default: 'codegraph-pr-review.md'

outputs:
  review-markdown:
    description: 'Full markdown text of the semantic PR review'
    value: ${{ steps.run-review.outputs.review }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install CodeGraph Engine
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install codegraph-engine==3.0.1

    - name: Generate Semantic PR Review
      id: run-review
      shell: bash
      run: |
        echo "Running CodeGraph Semantic PR Review against ${{ inputs.base-ref }}..."
        git fetch origin ${{ inputs.base-ref }}:${{ inputs.base-ref }} --depth=100 || true
        python -m codegraph pr-review ${{ inputs.base-ref }} HEAD -o ${{ inputs.output-file }}
        
        # Store in step output
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "review<<$EOF" >> $GITHUB_OUTPUT
        cat ${{ inputs.output-file }} >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Post PR Comment
      if: github.event_name == 'pull_request' && inputs.github-token != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const reviewBody = fs.readFileSync('${{ inputs.output-file }}', 'utf8');
          const issueNumber = context.payload.pull_request ? context.payload.pull_request.number : null;
          
          if (!issueNumber) {
            console.log('Not a pull request event. Skipping comment.');
            return;
          }

          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
          });

          const botComment = comments.data.find(c => c.body.includes('CodeGraph Semantic PR Review'));

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: reviewBody,
            });
            console.log('Updated existing CodeGraph PR review comment.');
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: reviewBody,
            });
            console.log('Posted new CodeGraph PR review comment.');
          }

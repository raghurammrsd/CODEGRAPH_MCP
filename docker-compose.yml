version: '3.8'

services:
  codegraph:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/raghurammrsd/codegraph:3.0.1
    container_name: codegraph-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Mount current repository root to /workspace
      - ./:/workspace:rw
    environment:
      - CODEGRAPH_HOST=0.0.0.0
      - CODEGRAPH_PORT=8765
      - PYTHONUNBUFFERED=1
    command: ["ui", "--host", "0.0.0.0", "--port", "8765", "--no-browser"]

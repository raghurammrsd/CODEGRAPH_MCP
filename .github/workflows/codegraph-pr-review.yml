name: CodeGraph PR Blast Radius Gate

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    name: Evaluate Semantic Blast Radius
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeGraph PR Review Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: 'origin/${{ github.base_ref }}'
